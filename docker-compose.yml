services:
  postgres_db:
    image: postgres:15-alpine
    container_name: leadflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: leadflow_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres_db

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: leadflow_frontend
    ports:
      - "80:80"

volumes:
  postgres_data:
